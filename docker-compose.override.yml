networks:
  infra-net:
    external: true

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: buka_client
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: bukka_server
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app:cached
      - /app/node_modules
    ports:
      - "8006:8006"
    networks:
      - infra-net
    command: sh -c "npx prisma db push && npm run start:dev"
