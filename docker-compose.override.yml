version: "3.9"

networks:
  infra-net:
    external: true

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: client
    env_file:
      - ./client/.env.local
    volumes:
      - ./client:/app:cached
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: server
    env_file:
      - ./server/.env
    volumes:
      - ./server/app:/app/app:cached
    ports:
      - "8000:8000"
    networks:
      - infra-net
