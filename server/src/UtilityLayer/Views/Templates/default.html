<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>{{title}}</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap");
        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap");

        * {
            margin: 0;
            padding: 0;
        }

        img {
            object-fit: contain;
        }

        .content p {
            font-size: 16px;
            font-weight: 500;
            color: #222222cc;
            line-height: 22.4px;
        }

        .button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 25px;
            font-size: 16px;
            color: #ffffff;
            background-color: #1bcd56;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            background-color: #ffffff;
            text-align: center;
            padding: 48px 20px 47px 20px;
            font-size: 12px;
        }

        .footer a {
            text-decoration: none;
            margin: 0 5px;
        }

        .footer img {
            margin: 10px 5px;
            height: 30px;
        }

        @media (max-width: 600px) {
            .header {
                padding: 15px;
            }
            .content {
                padding: 20px;
            }
            .footer {
                padding: 20px;
            }
            h1 {
                font-size: 24px;
                line-height: 32px;
            }
            .button {
                padding: 10px 20px;
                font-size: 14px;
            }
            p {
                font-size: 14px;
                line-height: 20px;
            }
        }
    </style>
</head>

<body style="font-family: 'Urbanist', sans-serif; background-color: #f1fffb66">
    <table style="border-spacing: 0; width: 100%; overflow: hidden; height: 100vh; margin: auto;">
        <!-- Header -->
        <tr>
            <td class="header" style="text-align: center; padding: 20px 0px;">
                <img
                    src="https://owo360storage.blob.core.windows.net/owo360-files-dev/general/image_name-1756555791154-4GpSQOVG.png"
                    alt="Task360 Logo"
                    width="100"
                    height="90"
                    style="max-height: 100px;"
                />
            </td>
        </tr>

        <!-- Content -->
        <tr>
            <td class="content" style="width: 100%; margin: 0 auto; padding: 20px 20px 65px 20px">
                <div style="max-width: 540px; width: 100%; margin: 0 auto">
                    <div>
                        <h1 style="font-size: 32px; color: #141416; line-height: 44.8px; font-weight: 700; text-align: center;">
                            {{title}}
                        </h1>
                    </div>

                    <div style="margin: 30px 0;">
                        <p style="font-size: 20px; line-height: 28px; font-weight: 600; color: #141416;">
                            Hello {{firstName}}
                        </p>
                        <p style="margin-top: 16px; color: #222222cc; font-size: 16px; line-height: 24px; text-align: justify;">
                            {{content}}
                        </p>
                    </div>

                    {{#if actionUrl}}
                    <div style="text-align: center;">
                        <a href="{{actionUrl}}" class="button" style="margin-top: 36px;">{{actionText}}</a>
                    </div>
                    {{/if}}

                    <div style="margin-top: 30px;">
                        <p style="color: #394150e5; font-weight: 400; font-size: 16px; line-height: 24px;">
                            If you need any assistance, don't hesitate to contact us:
                        </p>
                        <p style="color: #1bcd56; font-weight: 400; font-size: 16px; line-height: 24px;">
                            support@task360.com
                        </p>
                    </div>
                </div>
            </td>
        </tr>

        <!-- Footer -->
        <tr style="text-align: center">
            <td class="footer" style="text-align: center">
                <p style="margin-top: 20px">
                    <a href="https://www.facebook.com/profile.php?id=61580119222033">
                        <img alt="facebook" src="http://res.cloudinary.com/davtge5gc/image/upload/v1702485023/EventCovers/en8e0doaxoyyhgvpvbnz.png" width="30" />
                    </a>
                    <a href="https://www.linkedin.com/company/owo360">
                        <img alt="linkedin" src="http://res.cloudinary.com/davtge5gc/image/upload/v1702485074/EventCovers/qlv9zdqh3mmyd5kigjkq.png" width="30" />
                    </a>
                    <a href="https://www.instagram.com/owo360ltd/">
                        <img alt="instagram" src="http://res.cloudinary.com/davtge5gc/image/upload/v1702485108/EventCovers/jf5xnm71cda1tum3kyy8.png" width="30" />
                    </a>
                    <a href="https://twitter.com/uricreative">
                        <img alt="twitter" src="http://res.cloudinary.com/davtge5gc/image/upload/v1702485141/EventCovers/masioaxj88ldxmmpavbi.png" width="30" />
                    </a>
                </p>
                <p style="margin-top: 15px">
                    <a href="#" style="text-decoration: underline; font-size: 12px; color: #8c8c8c; line-height: 12px; font-weight: 500; font-family: 'Plus Jakarta Sans'; margin: 0 10px;">Read our Privacy Policy</a>
                    |
                    <a href="#" style="text-decoration: underline; font-size: 12px; color: #8c8c8c; line-height: 12px; font-weight: 500; font-family: 'Plus Jakarta Sans'; margin: 0 10px;">Contact Support</a>
                </p>
                <div style="color: #394150; font-weight: 400; font-family: 'Plus Jakarta Sans'; font-size: 10px; text-align: center; letter-spacing: 0.2%; margin-top: 15px;">
                    <p>Copyright © 2025</p>
                    <p style="margin-top: 5px">Task360</p>
                    <p style="margin-top: 5px">Powered by Owo360 Ltd</p>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
