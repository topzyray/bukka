    <style>
        @import url("https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap");

        @import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&display=swap");

        * {
            margin: 0;
            padding: 0;
        }

        img {
            object-fit: contain;
        }

        .content p {
            font-size: 16px;
            font-weight: 500;
            color: #222222cc;
            line-height: 22.4px;
            text-align: center;
            /* margin: 10px 0; */
        }

        .otp-box {
            width: 50px;
            height: 46px;
            border: 1px solid #1bcd56;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            color: #1bcd56;
        }

        .button {
            display: inline-block;
            margin: 20px 0;
            padding: 12px 25px;
            font-size: 16px;
            color: #ffffff;
            background-color: #1bcd56;
            text-decoration: none;
            border-radius: 5px;
        }

        .footer {
            background-color: #ffffff;
            text-align: center;
            padding: 48px 20px 47px 20px;
            font-size: 12px;
        }

        .footer a {
            text-decoration: none;
            margin: 0 5px;
        }

        .footer img {
            margin: 10px 5px;
            height: 30px;
        }
    </style>
</head>
