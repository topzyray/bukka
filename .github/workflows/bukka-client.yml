name: CI/CD – Next.js + Vercel for Bukka Client

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - ".github/workflows/bukka-client.yml"

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "pnpm"
          cache-dependency-path: "client/pnpm-lock.yaml"

      - name: Install Dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Set Environment Variables
        run: |
          echo "NEXT_PUBLIC_NODE_ENV=${{ secrets.NEXT_PUBLIC_NODE_ENV }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SECRET_KEY=${{ secrets.NEXT_PUBLIC_SECRET_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_DOMAIN_URL=${{ secrets.NEXT_PUBLIC_DOMAIN_URL }}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_LOCATIONIQ_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_LOCATIONIQ_ACCESS_TOKEN }}" >> $GITHUB_ENV
          echo "SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}" >> $GITHUB_ENV

      - name: Lint
        run: pnpm lint
        working-directory: client

      - name: Type Check
        run: pnpm type-check
        working-directory: client

      # Build the project (optional if Vercel handles it)
      - name: Build Project
        run: pnpm build
        working-directory: client

  # sonarcloud:
  #   name: SonarCloud Analysis
  #   needs: build-test
  #   runs-on: ubuntu-latest

  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: "20.x"

  #     - name: Install pnpm
  #       run: npm install -g pnpm

  #     - name: Install dependencies
  #       working-directory: client
  #       run: pnpm install --frozen-lockfile

  #     - name: SonarCloud Scan
  #       uses: SonarSource/sonarqube-scan-action@v6
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./client
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
