version: "3.9"

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    env_file:
      - ./server/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    env_file:
      - ./client/.env
    ports:
      - "3000:3000"
    depends_on:
      - server

  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./server/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data:
